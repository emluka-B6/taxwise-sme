# Golden values for tests/test_calc.py.
#
# Read on 2026-11-14 from the public calculators / official announcements cited below.
#
# PIT:
#   Ministerstwo Finansów (MF), "Stawki i limity" - the PIT scale: 12% up to the first
#   threshold, 32% above it, tax-free amount 30 000 PLN (a tax-reducing amount of 3 600 PLN).
#   https://www.podatki.gov.pl/podatki-osobiste/pit/stawki-i-limity/
#   The expected taxes are what the public MF PIT calculator returns for annual income
#   entered without deductions, exemptions or social/health contributions.
#
# ZUS:
#   ZUS, "Stopy procentowe składek na ubezpieczenia społeczne" and the annual contribution
#   announcements. Monthly totals for a sole proprietor:
#   * FULL - "duży ZUS" (social insurance, Fundusz Pracy, FGSP and minimum health),
#   * PREFERENTIAL_24M - "preferencyjne" (30% of the minimum wage base plus minimum health),
#   * ULGA_NA_START - the six-month window with the health contribution only.
#   https://www.zus.pl/baza-wiedzy/skladki-wskazniki-odsetki/skladki
#
# Money is a decimal string in PLN. Rates are deliberately absent from this fixture: the
# tests read them from config/tax_params/<year>.yaml so only outcomes are pinned here.
source:
  pit:
    name: "Ministerstwo Finansów - kalkulator PIT / stawki i limity"
    url: "https://www.podatki.gov.pl/podatki-osobiste/pit/stawki-i-limity/"
    read_at: "2026-11-14"
  zus:
