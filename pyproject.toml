[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taxwise-sme"
version = "0.1.0"
description = "Skeleton of a JDG finance assistant for Polish sole traders (B2B)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
]
postgres = ["psycopg[binary]>=3.2"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # Domain strings are deliberately kept close to legal Polish wording.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
