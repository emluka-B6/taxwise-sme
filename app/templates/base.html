<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }} · TaxWise SME</title>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: system-ui, sans-serif; line-height: 1.5; }
    header, main { margin: 0 auto; max-width: 72rem; padding: 0 1rem; }
    .topbar { display: flex; flex-wrap: wrap; gap: 1rem; align-items: baseline;
              padding-block: 1rem; border-bottom: 1px solid #8884; }
    .brand { font-weight: 700; text-decoration: none; }
    nav { display: flex; gap: 1rem; }
    nav a { text-decoration: none; }
    nav a:hover, nav a:focus { text-decoration: underline; }
    .panel { padding-block: 1.5rem; }
    form { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end;
           margin-block: 1rem; }
    form.inline { display: inline-flex; margin: 0; }
    label { display: grid; gap: .25rem; font-size: .875rem; }
    select, input, textarea, button { font: inherit; padding: .4rem; }
    textarea { width: 100%; }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #8884; padding: .5rem; text-align: left; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .mono { font-family: ui-monospace, monospace; font-size: .875rem; }
    .empty { text-align: center; color: #888; }
    .badge { border: 1px solid #8888; border-radius: .25rem; padding: 0 .35rem;
             font-size: .8125rem; }
    .error { border: 1px solid #c33; border-radius: .25rem; padding: .5rem .75rem;
             color: #c33; }
    .disclaimer { border-left: .25rem solid #c90; padding: .5rem .75rem;
                  background: #c9000010; font-size: .9375rem; }
    .answer { border: 1px solid #8884; border-radius: .5rem; padding: 1rem;
              margin-top: 1rem; }
    .meta { color: #666; font-size: .875rem; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/documents">TaxWise SME</a>
    <nav aria-label="Główna nawigacja">
      <a href="/documents">Dokumenty</a>
      <a href="/deadlines">Terminy</a>
      <a href="/assistant">Asystent</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
